repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-yaml
      # raw hand-label exports stay byte-exact: trailing whitespace can live inside a quoted note
      - id: end-of-file-fixer
        exclude: ^data/interim/odisha_labels/labels_.*\.csv$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^data/interim/odisha_labels/labels_.*\.csv$
