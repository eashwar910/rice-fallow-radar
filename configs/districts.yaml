# Study districts. Boundaries come from FAO GAUL 2025 in Earth Engine (2015 version is deprecated).
# Names verified against the asset on 6 Nov 2026 (GEE areas: Bolangir 6565 km2, Baleswar 3729 km2).
boundaries:
  gee_asset: FAO/GAUL/2025/level2
  country_field: GAUL0_NAME
  state_field: GAUL1_NAME
  district_field: GAUL2_NAME

districts:
  bolangir:
    state: Odisha
    gaul_name: Bolangir (Balangir)
    note: western uplands, dry edge dominates
  baleswar:
    state: Odisha
    gaul_name: Balasore (Baleshwar)
    note: coastal plain, wet edge dominates

# M1 forecast horizons, days before harvest
horizons_days: [7, 14, 21]

# D-019: until the protocol-v1 tag, no pipeline may read data dated on or after this.
data_cutoff: 2026-06-01

# P1b labelling (D-018, D-025). Season = 2025-26 kharif.
labelling:
  season_start: 2025-06-01
  season_end: 2026-02-15
  chip_window: [2025-09-15, 2026-02-15]   # dates offered as harvest candidates
  pool: 500          # candidate fields pulled for NDVI
  n_label: 200       # fields sent to the labelling tool (half uniform, half kharif-signature)
  n_repeat: 20       # shown a second time, for self-agreement
  seed: 20261119
  cloud_max: 0.4     # max mean Cloud Score+ cloudiness over a field for a usable scene
  chip_m: 200        # side of the chip window in metres (pilot: 500 m lost the field in context)
